    <script id="csinit" type="text/x-cindyscript">
    resetclock();
    it = 1;
    res = 512;
    pw = 2/res; // 2 = |P3-Q3| -> larger "function" canvas chosen s.t. this still holds!
    n = 12; // Density of chess tiling
    interpolate = true;
    mipmap = true;
    Navg = true;
    CRavg = false;
    LCRbased = false;
    angbased = false;
    noerr = true;

    createimage("function", 3/2 * res, 3/2 * res);
    // make function canvas large enough s.t. it does NOT intersect boundary of shape!!
    // Now: Can choose values like "var=1.337" what had caused massive errors before!
    createimage("codomain", res, res);
    createimage("bild", res, res);
    createimage("preimage", res, res);
    createimage("test", res, res);
    // TODO: Understand better how coordinates of the canvases and their "foot points" correlate and how they can be simplified

    pt2color(z) := ( (z_1, z_2, 1) );
    complex2color(z) := ( (re(z), im(z), 0) );

    refl(x, c, r) := (
      v0 = x-c;
      v1 = v0*(r*r)/(v0*v0);
      c + v1
    );

    refll(x, a, b) := (
      n = (a.y-b.y,b.x-a.x);
      x - 2*(((x-a)*n)/(n*n))*n
    );
/* //Bunt -> nicht ideal
    colorplot(Q3, R3, "bild",
        p = #;
        col = [0,0,0,0];
        apply(1..n, j,
            if(|p-M|<=1 & 2*pi*(j-1)/n-pi<=arctan2(p-M) & arctan2(p-M)<2*pi*j/n-pi,
            h = j/n;
            col = [1-h,h,h,1] - [0.12,0.12,0.12,0];
            if(|p-M|<=0.25, col = col + [0.12,0.12,0.12,0],
                if(|p-M|<=0.5, col = col + [0.08,0.08,0.08,0],
                    if(|p-M|<=0.75, col = col + [0.04,0.04,0.04,0]);
                    );
                );
            );
        );
        col
    );
*/

colorplot(Q3, R3, "bild",
    p = #;
    col = [0,0,0,0];
    k = 4; // number of "rings"
        //if(|p-M|<=1 & 2*pi*(j-1)/n-pi<=arctan2(p-M) & arctan2(p-M)<2*pi*j/n-pi,
        //    h = j/n;
        // );
        if(mod(floor(arctan2(p-M)*n/(2*pi)),2)==1,
            if(mod(floor(|k*(p-(4,0))|),2)==1,
            col=[0,0,0,1], col=[1,1,1,1]),
            if(mod(floor(|k*(p-(4,0))|),2)==1,
            col=[1,1,1,1], col=[0,0,0,1])
        );
    col
);

    // Try to test how many digits after comma stored by colorplot
    colorplot(Q3, R3, "test",
        p = #;
        tt = 0.0000000000000000001;
        //if( |p - Minvis| <= 0.00279, [1,1,1], [0,0,0])
        if( |p-M|<=1, [tt,1,1], [0,0,0])
    );

    colorplot(Q3, R3, "preimage",
        p = #;
        if(|p-M| <= 1,
        imagergba(Q3, R3, "bild", p), [0,0,0,0])
    );
    drawimage(interpolate->interpolate, Q3, R3, "preimage");

    Maux = 0.25*(A+B+C+D);
    lab = cross(A,B);
    lbc = cross(B,C);
    lcd = cross(C,D);
    lda = cross(D,A);
    raux1 = min([|lab*Maux.homog|/|sqrt((lab_1)^2+(lab_2)^2)|,
                |lbc*Maux.homog|/|sqrt((lbc_1)^2+(lbc_2)^2)|,
                |lcd*Maux.homog|/|sqrt((lcd_1)^2+(lcd_2)^2)|,
                |lda*Maux.homog|/|sqrt((lda_1)^2+(lda_2)^2)|]);
    raux2 = max([|lab*Maux.homog|/|sqrt((lab_1)^2+(lab_2)^2)|,
                |lbc*Maux.homog|/|sqrt((lbc_1)^2+(lbc_2)^2)|,
                |lcd*Maux.homog|/|sqrt((lcd_1)^2+(lcd_2)^2)|,
                |lda*Maux.homog|/|sqrt((lda_1)^2+(lda_2)^2)|]);
    raux3 = max([|Maux-A|,|Maux-B|,|Maux-C|,|Maux-D|]);
    AMAP = map(Maux, Maux+raux3*(1,0), Maux+raux3*(0,1), M, M+(1,0), M+(0,1)); //Alternativ: raux2, raux3
    //Das funktioniert nur solange A,B,C,D ein KONVEXES Viereck aufspannen!
    //TODO: Use Bücking exponent-t-center projective transformation as AMAP

    colorplot(Q2, R2, "function",
         p = #;
         hom = AMAP*[p_1,p_2,1];
         pt2color( (hom_1, hom_2)/hom_3 )
    );

    inquad(p) := (
        if(perpendicular(A.xy-B.xy) * (A.xy-p.xy) >= 0 &
           perpendicular(B.xy-C.xy) * (B.xy-p.xy) >= 0 &
           perpendicular(C.xy-D.xy) * (C.xy-p.xy) >= 0 &
           perpendicular(D.xy-A.xy) * (D.xy-p.xy) >= 0,true,false)
    );

    //TODO: allow multiple reflections!!
    read(p) := (
        q = p;
        k = 0;
        repeat(1,
        valab = perpendicular(A.xy-B.xy) * (A.xy-q);
        valbc = perpendicular(B.xy-C.xy) * (B.xy-q);
        valcd = perpendicular(C.xy-D.xy) * (C.xy-q);
        valda = perpendicular(D.xy-A.xy) * (D.xy-q);
        auxvar = min([valab, valbc, valcd, valda]);
        if(auxvar < 0,
        k = k+1;
        if( auxvar == valab,
            q = refll(p,A.xy,B.xy),
        if( auxvar == valbc,
            q = refll(p,B.xy,C.xy),
        if( auxvar == valcd,
            q = refll(p,C.xy,D.xy),
        if( auxvar == valda,
            q = refll(p,D.xy,A.xy),
            ))))
        );
        );

        imagept = imagergb(Q2, R2, "function", q, interpolate->interpolate);
        ipt = (imagept_1, imagept_2)/imagept_3;
        if(mod(k,2)==1, ipt = refl(ipt, M, 1));

        pt2color(ipt)
    );
</script>


<script>

<script id="csdraw" type="text/x-cindyscript">
//Switch
//WA.x = 5.8;
//WA.y = round(max(0,min(1,WA.y*2))) - .5;
//errswitch = WA.y + .5;
//draw((5.8,0.5),(5.8,-0.5),size->1,color->(1,1,1));
//drawtext((5.8,0.6),"LCR-based",size->10,color->(1,1,1),align->"center");
//drawtext((5.8,-0.6),"angle-based",size->10,color->(1,1,1),align->"center");

colorplot(Q3, R3, "preimage",
    p = #;
    if(|p-M|<=1,
    imagergba(Q3, R3, "bild", p), [0,0,0,0])
);
drawimage(interpolate->interpolate, Q3, R3, "preimage");

if(Navg & it>=2,
repeat(50,
colorplot(Q2, R2,"function",
        p = #;
        //var = 2 + 2/seconds();
        var = 1 + floor(res/(10*it));
        //var = 1;

        (1/8)*(
          read(p+var*pw*(1,0)) + read(p+var*pw*(0,1)) +
          read(p+var*pw*(-1,0)) + read(p+var*pw*(0,-1)) +
          read(p+var*pw*(1,1)) + read(p+var*pw*(-1,1)) +
          read(p+var*pw*(1,-1)) + read(p+var*pw*(-1,-1))
        )
        /*
            (1/4)*(
            read(p+var*pw*(1,0)) + read(p+var*pw*(0,1)) +
            read(p+var*pw*(-1,0)) + read(p+var*pw*(0,-1))
        )*/
        );
        //Apply Möbius transformation after each step
        colorplot(Q2, R2, "function",
            p = #;
            fA = read(A); //fA = image point
            cfA = (fA_1 - 4 + i*fA_2)/|(fA_1 - 4 + i*fA_2)|; //as complex number and projected onto unit circle (nec.?)
            fN = read(N);
            cfN = (fN_1 - 4 + i*fN_2);
            mat = [[-1, cfN],[0, cfN-cfA]]; //matrix for Möbius transformation mapping cfN->0, cfA->1, inf->inf
            helppt2 = (mat*(read(p)_1 - 4 + i*read(p)_2,1))_1 / (mat*(read(p)_1 - 4 + i*read(p)_2,1))_2;  //convert CP1 number to C
            helppt = exp(-i*arctan2( (re(cfA),im(cfA)) )) * (read(p)_1 - 4 + i*read(p)_2 - cfN) / (1 - conjugate(cfN) * (read(p)_1 - 4 + i*read(p)_2));
            //helppt = (read(p)_1 - 4 + i*read(p)_2 - cfN) / (1 - conjugate(cfN) * (read(p)_1 - 4 + i*read(p)_2));
            pt2color((re(helppt),im(helppt)) + (4,0)) //translations for coordinate reasons
        );
);
);


if(CRavg & it>=2,
repeat(50,
colorplot(Q2, R2,"function",
        p = #;
        var = 1 + floor(res/(10*it)); // corresponds to "radius" of the involved circles
        //var = 1;

        //TODO: make those terms nicer!!

        ga = read(p+var*pw*(1,0))_1     + i*read(p+var*pw*(1,0))_2;
        ha = read(p+var*pw*(0,1))_1     + i*read(p+var*pw*(0,1))_2;
        fa = read(p+var*pw*(1,1))_1     + i*read(p+var*pw*(1,1))_2;
        gb = read(p+var*pw*(-1,0))_1    + i*read(p+var*pw*(-1,0))_2;
        hb = read(p+var*pw*(0,-1))_1    + i*read(p+var*pw*(0,-1))_2;
        fb = read(p+var*pw*(-1,-1))_1   + i*read(p+var*pw*(-1,-1))_2;
        gc = read(p+var*pw*(-1,0))_1    + i*read(p+var*pw*(-1,0))_2;
        hc = read(p+var*pw*(0,1))_1     + i*read(p+var*pw*(0,1))_2;
        fc = read(p+var*pw*(-1,1))_1    + i*read(p+var*pw*(-1,1))_2;
        gd = read(p+var*pw*(1,0))_1     + i*read(p+var*pw*(1,0))_2;
        hd = read(p+var*pw*(0,-1))_1    + i*read(p+var*pw*(0,-1))_2;
        fd = read(p+var*pw*(1,-1))_1    + i*read(p+var*pw*(1,-1))_2;
        ea = read(p+var*pw*(2,0))_1     + i*read(p+var*pw*(2,0))_2;
        eb = read(p+var*pw*(0,2))_1     + i*read(p+var*pw*(0,2))_2;
        ec = read(p+var*pw*(-2,0))_1    + i*read(p+var*pw*(-2,0))_2;
        ed = read(p+var*pw*(0,-2))_1    + i*read(p+var*pw*(0,-2))_2;
        sc = read(p+var*pw*(-1,sqrt(3)))_1      + i*read(p+var*pw*(-1,sqrt(3)))_2;
        sd = read(p+var*pw*(-1,-sqrt(3)))_1     + i*read(p+var*pw*(-1,-sqrt(3)))_2;
        se = read(p+var*pw*(1,sqrt(3)))_1       + i*read(p+var*pw*(1,sqrt(3)))_2;
        sf = read(p+var*pw*(1,-sqrt(3)))_1      + i*read(p+var*pw*(1,-sqrt(3)))_2;
        sg = read(p+var*pw*(sqrt(3),1))_1       + i*read(p+var*pw*(sqrt(3),1))_2;
        sh = read(p+var*pw*(-sqrt(3),1))_1      + i*read(p+var*pw*(-sqrt(3),1))_2;
        si = read(p+var*pw*(-sqrt(3),-1))_1     + i*read(p+var*pw*(-sqrt(3),-1))_2;
        sj = read(p+var*pw*(sqrt(3),-1))_1      + i*read(p+var*pw*(sqrt(3),-1))_2;

        // These w_i are points lying cocircularly in harmonic position with the 3 read off image points fa, fb, ..., respectively
        wa = (fa*ha - 2*ha*ga + ga*fa)/(2*fa - ha - ga);
        wb = (fb*hb - 2*hb*gb + gb*fb)/(2*fb - hb - gb);
        wc = (fc*hc - 2*hc*gc + gc*fc)/(2*fc - hc - gc);
        wd = (fd*hd - 2*hd*gd + gd*fd)/(2*fd - hd - gd);
        we = (ea*fa - 2*fa*fd + fd*ea)/(2*ea - fa - fd);
        wf = (eb*fa - 2*fa*fc + fc*eb)/(2*eb - fa - fc);
        wg = (ec*fb - 2*fb*fc + fc*ec)/(2*ec - fb - fc);
        wh = (ed*fb - 2*fb*fd + fd*ed)/(2*ed - fb - fd);

        // Determinante prüfen, um korrekte Orientierung zu bestimmen
        if( det([[re(ea),re(sc),re(sd)],[im(ea),im(sc),im(sd)],[1,1,1]]) >= 0,
            wi = (2*ea*sc + i*(i+sqrt(3))*ea*sd + (-1-i*sqrt(3))*sc*sd)/((1+i*sqrt(3))*ea + (1-i*sqrt(3))*sc - 2*sd),
            wi = (2*ea*sd + i*(i+sqrt(3))*ea*sc + (-1-i*sqrt(3))*sd*sc)/((1+i*sqrt(3))*ea + (1-i*sqrt(3))*sd - 2*sc)
        );
        if( det([[re(ec),re(se),re(sf)],[im(ec),im(se),im(sf)],[1,1,1]]) >= 0,
            wj = (2*ec*se + i*(i+sqrt(3))*ec*sf + (-1-i*sqrt(3))*se*sf)/((1+i*sqrt(3))*ec + (1-i*sqrt(3))*se - 2*sf),
            wj = (2*ec*sf + i*(i+sqrt(3))*ec*se + (-1-i*sqrt(3))*sf*se)/((1+i*sqrt(3))*ec + (1-i*sqrt(3))*sf - 2*se)
        );
        // wi und wj: DV von Mittelpunkt eines gleichseitigen Dreiecks mit Eckpunkten
        if( det([[re(sg),re(sh),re(ed)],[im(sg),im(sh),im(ed)],[1,1,1]]) >= 0,
            wk = (2*sg*sh + i*(i+sqrt(3))*sg*ed + (-1-i*sqrt(3))*sh*ed)/((1+i*sqrt(3))*sg + (1-i*sqrt(3))*sh - 2*ed),
            wk = (2*sg*ed + i*(i+sqrt(3))*sg*sh + (-1-i*sqrt(3))*ed*sh)/((1+i*sqrt(3))*sg + (1-i*sqrt(3))*ed - 2*sh)
        );

        if( det([[re(si),re(sj),re(eb)],[im(si),im(sj),im(eb)],[1,1,1]]) >= 0,
            wl = (2*si*sj + i*(i+sqrt(3))*si*eb + (-1-i*sqrt(3))*sj*eb)/((1+i*sqrt(3))*si + (1-i*sqrt(3))*sj - 2*eb),
            wl = (2*si*eb + i*(i+sqrt(3))*si*sj + (-1-i*sqrt(3))*eb*sj)/((1+i*sqrt(3))*si + (1-i*sqrt(3))*eb - 2*sj)
        );

        if( det([[re(wa),re(wb),re(wc)],[im(wa),im(wb),im(wc)],[1,1,1]]) >= 0,
            za = (2*wa*wb + i*(i+sqrt(3))*wa*wc + (-1-i*sqrt(3))*wb*wc)/((1+i*sqrt(3))*wa + (1-i*sqrt(3))*wb - 2*wc),
            za = (2*wa*wc + i*(i+sqrt(3))*wa*wb + (-1-i*sqrt(3))*wc*wb)/((1+i*sqrt(3))*wa + (1-i*sqrt(3))*wc - 2*wb)
        );
        if( det([[re(wd),re(we),re(wf)],[im(wd),im(we),im(wf)],[1,1,1]]) >= 0,
            zb = (2*wd*we + i*(i+sqrt(3))*wd*wf + (-1-i*sqrt(3))*we*wf)/((1+i*sqrt(3))*wd + (1-i*sqrt(3))*we - 2*wf),
            zb = (2*wd*wf + i*(i+sqrt(3))*wd*we + (-1-i*sqrt(3))*wf*we)/((1+i*sqrt(3))*wd + (1-i*sqrt(3))*wf - 2*we)
        );
        if( det([[re(wg),re(wh),re(wi)],[im(wg),im(wh),im(wi)],[1,1,1]]) >= 0,
            zc = (2*wg*wh + i*(i+sqrt(3))*wg*wi + (-1-i*sqrt(3))*wh*wi)/((1+i*sqrt(3))*wg + (1-i*sqrt(3))*wh - 2*wi),
            zc = (2*wg*wi + i*(i+sqrt(3))*wg*wh + (-1-i*sqrt(3))*wi*wh)/((1+i*sqrt(3))*wg + (1-i*sqrt(3))*wi - 2*wh)
        );
        if( det([[re(za),re(zb),re(zc)],[im(za),im(zb),im(zc)],[1,1,1]]) >= 0,
            final = (2*za*zb + i*(i+sqrt(3))*za*zc + (-1-i*sqrt(3))*zb*zc)/((1+i*sqrt(3))*za + (1-i*sqrt(3))*zb - 2*zc),
            final = (2*zb*za + i*(i+sqrt(3))*zb*zc + (-1-i*sqrt(3))*za*zc)/((1+i*sqrt(3))*zb + (1-i*sqrt(3))*za - 2*zc)
        );

        //ipt = 1/4 * (re(wi+wj+wk+wl),im(wi+wj+wk+wl));
        //ipt = (re(wl),im(wl));

        //TODO: Try CPP and APP interpolation!!
        //TODO: After each iteration, apply Möbius trafo to fix 3 degrees of freedom!!

        //ipt = (1/4)*(
        //    (re(za),im(za)) + (re(zb),im(zb)) + (re(zc),im(zc)) + (re(wi),im(wi))
        //);


        ipt = (1/8)*(
            (re(wa),im(wa)) + (re(wb),im(wb)) +
            (re(wc),im(wc)) + (re(wd),im(wd)) +
            (re(we),im(we)) + (re(wf),im(wf)) +
            (re(wg),im(wg)) + (re(wh),im(wh)) //+ (re(wi),im(wi)) + (re(wj),im(wj))
        );


        pt2color(ipt)
        );


        colorplot(Q2, R2, "function",
            p = #;
            fA = read(A); //fA = image point
            cfA = (fA_1 - 4 + i*fA_2)/|(fA_1 - 4 + i*fA_2)|; //as complex number and projected onto unit circle (nec.?)
            fN = read(N);
            cfN = (fN_1 - 4 + i*fN_2);
            mat = [[-1, cfN],[0, cfN-cfA]]; //matrix for Möbius transformation mapping cfN->0, cfA->1, inf->inf
            helppt = (mat*(read(p)_1 - 4 + i*read(p)_2,1))_1 / (mat*(read(p)_1 - 4 + i*read(p)_2,1))_2;  //convert CP1 number to C
            pt2color((re(helppt),im(helppt)) + (4,0)) //translations for coordinate reasons
        );
);
);


// Make triangular lattice like that:
//  0----0----0
//  |  / 1  2 |
//  | /  | /  |
//  0----p--3-0
//  |  / |  / |
//  | /  | /  |
//  0----0----0
// => if p is not on boundary: p contained in 6 inner edges
// LCR actually works on edges, not on vertices:
// Add absolute values of "LCR-differences" for three edges in upper right corner


colorplot(Q, R, "codomain",
    p = #;

    // "image triangulation"

    //funcp00 = imagergb(Q2, R2, "function", p+(0,0)/res, mipmap->mipmap);
    //funcp01 = imagergb(Q2, R2, "function", p+(0,1)/res, mipmap->mipmap);
    //funcp11 = imagergb(Q2, R2, "function", p+(1,1)/res, mipmap->mipmap);
    //funcp10 = imagergb(Q2, R2, "function", p+(1,0)/res, mipmap->mipmap);
    //funcpm10 = imagergb(Q2, R2, "function", p+(-1,0)/res, mipmap->mipmap);
    //funcp0m1 = imagergb(Q2, R2, "function", p+(0,-1)/res, mipmap->mipmap);

    funcp00 = imagergb(Q2, R2, "function", p+(0,0)/res);
    funcp01 = imagergb(Q2, R2, "function", p+(0,1)/res);
    funcp11 = imagergb(Q2, R2, "function", p+(1,1)/res);
    funcp10 = imagergb(Q2, R2, "function", p+(1,0)/res);
    funcpm10 = imagergb(Q2, R2, "function", p+(-1,0)/res);
    funcp0m1 = imagergb(Q2, R2, "function", p+(0,-1)/res);

/*
    funcp00 = read(p+(0,0)/res);
    funcp01 = read(p+(0,1)/res);
    funcp11 = read(p+(1,1)/res);
    funcp10 = read(p+(1,0)/res);
    funcpm10 = read(p+(-1,0)/res);
    funcp0m1 = read(p+(0,-1)/res);
*/

    // length cross ratio error
    // TODO: How to deal with boundary edges? -> Not really important since "mesh" goes on after circle boundary
    LCR1 = sqrt(2)*sqrt(2) - |funcp11 - funcp00| * |funcp01 - funcpm10| / (|funcp11 - funcp01| * |funcpm10 - funcp00|);
    LCR2 = 1 - |funcp10 - funcp00| * |funcp11 - funcp01| / (|funcp11 - funcp10| * |funcp01 - funcp00|);
    LCR3 = 1/(sqrt(2)*sqrt(2)) - |funcp0m1 - funcp00| * |funcp11 - funcp10| / (|funcp10 - funcp0m1| * |funcp11 - funcp00|);
    var2 = 1; // raise it to "look at precision of LCR-error"
    LCRerrcol = hue(var2*(|LCR1| + |LCR2| + |LCR3|) + 1/3);
    imgcol = imagergba(Q3, R3, "preimage", (funcp00_1, funcp00_2), interpolate->interpolate);

    // "elementary angle measurement" error
    n1 = funcp11 - funcp00;
    n2 = funcp01 - funcp10;
    angerror = (n1/|n1|) * (n2/|n2|);
    angerrcol = hue(angerror + 1/3);

    LCRcoeff = if(LCRbased, 0.5, 0);
    angcoeff = if(angbased, 0.5, 0);
    imgcolcoeff = if(noerr, 1, 0.5);

    if( inquad(p), //inquad(p), |p-Minvis|<=2
        imgcol * imgcolcoeff
        + [LCRerrcol_1,LCRerrcol_2,LCRerrcol_3,1] * LCRcoeff
        + [angerrcol_1,angerrcol_2,angerrcol_3,1] * angcoeff,
        [0,0,0,0])
);


drawimage(interpolate->interpolate, Q, R,"codomain");

  <script>
    // shown inside the talk slides: arrow keys and space keep moving through the slides
    addEventListener("keydown", function (e) {
      var R = window.parent !== window && window.parent.Reveal;
      if (!R) return;
      if (["ArrowRight", "ArrowDown", "PageDown", " "].indexOf(e.key) >= 0) { R.next(); e.preventDefault(); }
      else if (["ArrowLeft", "ArrowUp", "PageUp"].indexOf(e.key) >= 0) { R.prev(); e.preventDefault(); }
    });
  </script>
